info:
  name: Get Types
  type: http
  seq: 3
  description: |-
    Lists all available training types.

    Use this before creating or updating a training plan so TrainingTypeId refers
    to an existing type. The request requires the API-KEY environment variable.
    Returns 200 OK with an array of training types.

http:
  method: GET
  url: "{{baseUrl}}/types"
  headers:
    - name: API-KEY
      value: "{{API-KEY}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
